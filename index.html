<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#267c73"><title>Les petits explorateurs des mots — Deux parcours</title><style>
:root{--ink:#25344b;--green:#247b70;--blue:#3e6da4;--red:#bd4d54;--violet:#8462a5;--cream:#fff8e9}*{box-sizing:border-box}body{margin:0;background:linear-gradient(150deg,#fff1d7,#e7f5ed);font:17px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}main{max-width:760px;margin:auto;padding:18px 15px 65px}header{display:flex;gap:12px;align-items:center;margin-bottom:20px}.fox{font-size:38px}h1{font-size:clamp(24px,5vw,34px);line-height:1.12;margin:0}h2{font-size:25px;margin:0 0 12px}h3{margin:8px 0}.muted{color:#657083;font-size:15px}.card{background:white;border-radius:23px;padding:22px;margin:14px 0;box-shadow:0 8px 25px #24354a13}.pill{display:inline-block;background:#e3f3ee;color:#176c61;border-radius:30px;padding:5px 12px;font-size:13px;font-weight:750;margin-bottom:10px}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 16px;font-weight:750;min-height:48px;background:var(--green);color:white;margin:4px 4px 4px 0}button.secondary{background:#eaf1f0;color:var(--ink)}button:disabled{opacity:.5}.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:13px}.path{border:2px solid #d9e6e2;background:#fff;border-radius:20px;padding:18px;text-align:left;width:100%;min-height:165px;color:var(--ink)}.path strong{font-size:21px;display:block}.path .icon{font-size:43px}.path small{font-size:14px;display:block;color:#536173;margin-top:7px}.art{font-size:70px;text-align:center;background:#f1f8f1;border-radius:18px;padding:15px;min-height:132px;display:flex;align-items:center;justify-content:center}.scene{width:100%;max-width:460px;height:auto;display:block}.plural{color:#d72e39}.phrase{font-size:clamp(25px,6vw,35px);font-weight:800;text-align:center;background:var(--cream);padding:18px 8px;border-radius:15px;margin:13px 0}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px}.choices button{background:white;color:var(--ink);border:2px solid #c8dcd6;margin:0}.choices button:active{background:#e6f3ed}.tip{background:#fff3d9;border-left:5px solid #edac4f;border-radius:9px;padding:13px;margin-top:13px}.good{background:#e4f5e8;border-left:5px solid #49a16b;padding:13px;border-radius:10px}.bad{background:#fff0e9;border-left:5px solid #d98564;padding:13px;border-radius:10px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input{width:100%;font:inherit;padding:13px;border:2px solid #d0ded9;border-radius:12px}.meter{height:9px;background:#e7eeeb;border-radius:20px;overflow:hidden;margin:12px 0}.meter span{display:block;height:100%;background:#45a28b}.label{font-size:14px;color:#56657a}.hidden{display:none}.subject{color:var(--red)}.verb{color:var(--green)}.object{color:var(--blue)}.circ{color:var(--violet)}.footer{font-size:13px;color:#637085;text-align:center;margin-top:22px}</style></head><body><main><header><div class="fox">✿</div><div><h1>Les petits explorateurs des mots</h1><div class="muted">Deux aventures à partager avec un parent</div></div></header><div id="app"></div><div class="footer">Prototype pédagogique • Utilisation accompagnée • Les progrès restent sur cet appareil</div></main><script>
'use strict';const $=document.getElementById('app');let child=localStorage.getItem('pem_child')||'',track='',level=0,stage=0,tries=0,helped=false,attempts=0,history=[];const A=[
{title:'Phrases simples : sujet + verbe',intro:'Identifier d’abord l’action, puis qui fait cette action.',items:[['Le chat dort.','🐈💤','dort','Le chat','mange','La souris'],['Le chien court.','🐕💨','court','Le chien','dort','Le garçon'],['La fille chante.','👧🎵','chante','La fille','joue','Le chat'],['Le bébé pleure.','👶💧','pleure','Le bébé','dort','La fille'],['Le garçon saute.','🧒⬆️','saute','Le garçon','marche','Le chien']]},
{title:'Sujet + verbe + COD',intro:'Repérer l’action, celui qui agit, puis ce sur quoi porte l’action.',items:[['Le garçon mange une pomme.','🧒🍎','mange','Le garçon','une pomme','boit','La fille'],['La fille ouvre la porte.','👧🚪','ouvre','La fille','la porte','ferme','Le garçon'],['Le chat attrape une souris.','🐈🐁','attrape','Le chat','une souris','regarde','Le chien']]},
{title:'Sujet + verbe + COI',intro:'Identifier le complément introduit par une préposition.',items:[['La fille parle à sa maman.','👧🗣️👩','parle','La fille','à sa maman','chante','Le garçon'],['Le garçon téléphone à son papi.','🧒📞👴','téléphone','Le garçon','à son papi','écrit','La fille'],['La femme sourit à son voisin.','👩🙂🧑','sourit','La femme','à son voisin','parle','Le chien']]},
{title:'Compléments circonstanciels',intro:'Repérer où, quand ou comment se déroule l’action.',items:[['Le chien dort dans son panier.','🐕🧺','dort','Le chien','dans son panier','court','Le chat','Où ?'],['Le garçon joue après l’école.','🧒🏫','joue','Le garçon','après l’école','dort','La fille','Quand ?'],['La fille marche lentement.','👧🚶','marche','La fille','lentement','court','Le garçon','Comment ?']]},
{title:'Plusieurs compléments',intro:'Distinguer les rôles des différents groupes de mots.',items:[['Le garçon donne une fleur à sa maman.','🧒🌷👩','donne','Le garçon','une fleur','prend','La fille','À qui ?','à sa maman'],['La fille pose son livre sur la table.','👧📖🪑','pose','La fille','son livre','ouvre','Le garçon','Où ?','sur la table']]}
];const B=[
{title:'Un ou plusieurs ?',intro:'Comprendre le singulier et le pluriel.',items:[['un chat','🐈','un seul','plusieurs'],['des chiens','🐕🐕🐕','plusieurs','un seul'],['une fleur','🌷','un seul','plusieurs'],['des pommes','🍎🍎🍎','plusieurs','un seul']]},
{title:'Accorder le déterminant et le nom',intro:'Choisir la forme correcte du groupe nominal.',items:[['plusieurs chats','🐈🐈🐈','des chats','un chats','des chat'],['une seule fleur','🌷','une fleur','des fleur','une fleurs'],['plusieurs chiens','🐕🐕','des chiens','un chiens','des chien']]},
{title:'Repérer le sujet et le verbe',intro:'Identifier le sujet avant de choisir la terminaison.',items:[['Les enfants jouent.','🧒👧⚽','Les enfants','jouent'],['La fille chante.','👧🎵','La fille','chante'],['Les chats dorment.','🐈🐈💤','Les chats','dorment']]},
{title:'Accorder le verbe avec son sujet',intro:'Choisir la terminaison adaptée.',items:[['Les enfants ... dans le jardin.','🧒👧🌳','jouent','joue','joues'],['Le chien ... dans son panier.','🐕🧺','dort','dorment','dors'],['Les filles ... une chanson.','👧👧🎵','chantent','chante','chantes'],['La souris ... du fromage.','🐁🧀','mange','mangent','manges']]},
{title:'Accorder les adjectifs',intro:'Observer le genre et le nombre du nom.',items:[['Les fleurs sont ...','🌷🌷🌷','jolies','jolie','jolis'],['Le chat est ...','🐈','noir','noirs','noire'],['Les chiens sont ...','🐕🐕','petits','petit','petites']]},
{title:'Réinvestir dans une phrase',intro:'Choisir une phrase entièrement correcte.',items:[['Deux enfants jouent.','🧒👧⚽','Les enfants jouent.','Les enfant jouent.','Les enfants joue.'],['Trois chats dorment.','🐈🐈🐈💤','Les chats dorment.','Les chat dorment.','Les chats dort.']]}
];let itemIndex=0,questionIndex=0,active=null;const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function showHome(){$.innerHTML=`<section class="card"><span class="pill">Bienvenue dans l’aventure</span><h2>Bonjour ${escapeHtml(child||'explorateur')} ! 🌟</h2><p>Choisis un monde. Chaque séance se fait avec un adulte, à ton rythme.</p><label for="name">Prénom de l’enfant (facultatif)</label><input id="name" maxlength="30" value="${escapeHtml(child)}" placeholder="Prénom"><button id="save">Enregistrer</button></section><section class="paths"><button class="path" id="pathA"><span class="icon">▣</span><strong>Le royaume des phrases</strong><small>Comprendre l’action, le sujet et les compléments. 5 étapes.</small></button><button class="path" id="pathB"><span class="icon">✿</span><strong>La forêt des accords</strong><small>Du singulier et du pluriel aux accords dans la phrase. 6 étapes.</small></button></section><section class="card"><h3>Pour les parents</h3><p>Lisez la consigne ensemble. Laissez votre enfant réfléchir. En cas d’erreur, une aide apparaît et une phrase de même structure est proposée.</p><p class="muted">Ce prototype n’est ni un test diagnostique ni un traitement. Les dessins sont provisoires.</p></section>`;document.getElementById('save').onclick=()=>{child=document.getElementById('name').value.trim();localStorage.setItem('pem_child',child);showHome()};document.getElementById('pathA').onclick=()=>choose('A');document.getElementById('pathB').onclick=()=>choose('B')}
function choose(t){track=t;let data=t==='A'?A:B;let buttons=data.map((x,i)=>`<button class="path" data-l="${i}"><strong>${i+1}. ${escapeHtml(x.title)}</strong><small>${escapeHtml(x.intro)}</small></button>`).join('');$.innerHTML=`<section class="card"><button class="secondary" id="back">← Accueil</button><span class="pill">${t==='A'?'Royaume des phrases':'Forêt des accords'}</span><h2>Choisis une étape</h2><p>Les étapes sont accessibles pour faciliter les essais. Une version ultérieure proposera un parcours réellement adaptatif.</p><div class="paths">${buttons}</div></section>`;document.getElementById('back').onclick=showHome;document.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>start(+b.dataset.l))}
function start(n){level=n;itemIndex=0;questionIndex=0;tries=0;helped=false;attempts=0;history=[];renderQuestion()}
function getQuestion(){let data=(track==='A'?A:B)[level],r=data.items[itemIndex%data.items.length],phase=questionIndex;if(track==='A'){let prompt,correct,options,extra='';if(phase===0){prompt='Quelle est l’action ?';correct=r[2];options=[r[2],r[5]];extra='Cherche ce que fait le personnage.'}else if(phase===1){prompt='Qui fait l’action ?';correct=r[3];options=[r[3],r[6]];extra='Cherche qui réalise cette action.'}else if(phase===2){let kind=level===1?'Quoi ?':level===2?'À qui ?':level===3?(r[7]||'Où ?'):(r[7]||'Quoi ?');prompt=kind==='Quoi ?'?'Sur quoi porte l’action ?':kind==='À qui ?'?'À qui s’applique l’action ?':kind==='Où ?'?'Où se passe l’action ?':kind==='Quand ?'?'Quand se passe l’action ?':kind==='Comment ?'?'Comment se passe l’action ?':'À qui s’applique l’action ?';correct=(level===4&&r[8])?r[8]:r[4];options=[correct,r[3]];extra='Pose la question à partir du verbe.'}else{prompt='Choisis la phrase qui correspond à l’image.';correct=r[0];options=[r[0],r[0].replace(/\.$/,' ?')];extra='Observe la scène et relis la phrase.'}return{phrase:r[0],art:r[1],prompt,correct,options,extra,spoken:r[0]+' '+prompt}}else{let prompt=level===0?'Y a-t-il un seul élément ou plusieurs ?':level===1?'Quel groupe de mots est bien écrit ?':level===2?(questionIndex===0?'Qui fait l’action ?':'Quel est le verbe ?'):level===3?'Quelle forme du verbe convient ?':level===4?'Quel adjectif convient ?':'Quelle phrase est correctement écrite ?';let correct=level===2?(questionIndex===0?r[2]:r[3]):r[2],options=level===2?[r[2],r[3]]:r.slice(2);if(level===0){correct=r[2];options=['un seul','plusieurs'];}return{phrase:r[0],art:r[1],prompt,correct,options,extra:'Observez avec votre enfant le nombre d’éléments représentés. Montrez ensuite les marques écrites du pluriel.',spoken:r[0]+'. '+prompt}}}

function illustration(phrase){
 const svg=(body)=>`<svg class="scene" viewBox="0 0 420 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Dessin illustrant : ${escapeHtml(phrase)}"><rect width="420" height="210" rx="22" fill="#f0f8f3"/><path d="M25 175 Q210 160 395 175" stroke="#bad9c7" stroke-width="3" fill="none"/>${body}</svg>`;
 const apple=(x,y)=>`<g transform="translate(${x} ${y})"><path d="M0 7 C-21 -5 -33 13 -27 35 C-19 60 -4 59 0 54 C12 61 26 47 29 28 C32 7 18 -5 0 7Z" fill="#e94f55" stroke="#ae3543" stroke-width="2"/><path d="M0 7 Q0 -8 6 -16" stroke="#74502d" stroke-width="4" fill="none"/><path d="M4 -9 Q24 -25 27 -9 Q15 2 4 -9" fill="#55a875"/></g>`;
 const flower=(x,y)=>`<g transform="translate(${x} ${y})"><path d="M0 0V48" stroke="#45946c" stroke-width="5"/><path d="M0 32Q-23 7 -28 29Q-10 40 0 32" fill="#62b889"/><g fill="#ef86ad" stroke="#ce668e" stroke-width="1.5"><circle cx="-13" cy="-6" r="13"/><circle cx="13" cy="-6" r="13"/><circle cx="0" cy="-19" r="13"/><circle cx="0" cy="8" r="13"/></g><circle r="10" fill="#ffd46d"/></g>`;
 const person=(x,y,shirt='#79a9ce')=>`<g transform="translate(${x} ${y})"><ellipse cx="0" cy="84" rx="39" ry="8" fill="#dbe8e0"/><path d="M-15 46L-19 81M15 46L19 81" stroke="#536d87" stroke-width="11" stroke-linecap="round"/><path d="M-22 3Q0 -6 22 3L28 52H-28Z" fill="${shirt}" stroke="#537a94" stroke-width="2"/><path d="M-22 10L-41 37M22 10L41 37" stroke="#e9b58f" stroke-width="9" stroke-linecap="round"/><circle cy="-22" r="23" fill="#f3c9a6" stroke="#c79575" stroke-width="2"/><path d="M-22 -30Q-15 -57 6 -48Q28 -46 22 -25Q9 -40 -4 -36Q-14 -30 -22 -30" fill="#76553d"/><circle cx="-8" cy="-20" r="2" fill="#3b3c43"/><circle cx="8" cy="-20" r="2" fill="#3b3c43"/><path d="M-7 -9Q0 -3 7 -9" stroke="#ae6b64" stroke-width="2" fill="none"/></g>`;
 const animal=(x,y,cat=true,sleep=false)=>`<g transform="translate(${x} ${y})"><ellipse cx="0" cy="42" rx="56" ry="28" fill="${cat?'#e4a26c':'#c7a07a'}" stroke="#967354" stroke-width="2"/><path d="M40 38Q80 5 66 -16" stroke="#967354" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="-36" cy="18" r="27" fill="${cat?'#e4a26c':'#c7a07a'}" stroke="#967354" stroke-width="2"/>${cat?'<path d="M-60 2L-56 -23L-38 -8L-21 -23L-13 5" fill="#e4a26c" stroke="#967354" stroke-width="2"/>':'<ellipse cx="-57" cy="0" rx="12" ry="23" fill="#a67d59"/>'}${sleep?'<path d="M-48 18q7 -6 14 0m6 0q7 -6 14 0" stroke="#614a3a" stroke-width="2" fill="none"/>':'<circle cx="-46" cy="17" r="3" fill="#45382f"/><circle cx="-26" cy="17" r="3" fill="#45382f"/>'}<circle cx="-36" cy="28" r="3" fill="#6b4c42"/></g>`;
 let low=phrase.toLowerCase();
 if(low.includes('pomme')){let n=/des pommes|plusieurs|trois/.test(low)?3:1;return svg(Array.from({length:n},(_,i)=>apple(210+(i-(n-1)/2)*100,90)).join(''))}
 if(low.includes('fleur')&&!low.includes('donne')){let n=/les fleurs|plusieurs|des fleurs/.test(low)?3:1;return svg(Array.from({length:n},(_,i)=>flower(210+(i-(n-1)/2)*90,90)).join(''))}
 if(low.includes('chat')||low.includes('chien')||low.includes('souris')){let n=/les chats|des chats|les chiens|des chiens|plusieurs chats|plusieurs chiens|trois chats/.test(low)?3:1;let cat=!low.includes('chien');return svg(Array.from({length:n},(_,i)=>animal(210+(i-(n-1)/2)*125,80,cat,/dort|dorment/.test(low))).join(''))}
 if(low.includes('femme')||low.includes('fille')||low.includes('garçon')||low.includes('enfant')||low.includes('bébé')){let two=/les enfants|les filles|deux enfants/.test(low);let other=/maman|voisin|papi/.test(low);return svg(person(two||other?140:210,75,'#e9a0a2')+(two||other?person(285,75,'#8fb5a2'):'')+(low.includes('livre')?'<rect x="245" y="125" width="50" height="33" rx="4" fill="#779bd0"/>':'')+(low.includes('porte')?'<rect x="310" y="30" width="55" height="142" rx="4" fill="#c9a07b"/>':''))}
 return svg(person(210,75));
}
function formatPhrase(t){let safe=escapeHtml(t);if(/\bdes pommes\b/i.test(t))return safe.replace(/\bdes pommes\b/gi,'<span class="plural">des</span> pomme<span class="plural">s</span>');return safe;}

function shuffled(arr){let a=[...new Set(arr)];return a.sort((x,y)=>x.localeCompare(y,'fr'))}function renderQuestion(){let data=(track==='A'?A:B)[level];active=getQuestion();let total=data.items.length,progress=Math.round(itemIndex/total*100);$.innerHTML=`<section class="card"><div class="row"><button class="secondary" id="back">← Étapes</button><span class="pill">${track==='A'?'Phrases':'Accords'} · Étape ${level+1}</span></div><h2>${escapeHtml(data.title)}</h2><div class="label">Exemple ${Math.min(itemIndex+1,total)} sur ${total}${track==='A'?' · Question '+(questionIndex+1)+' sur '+(level===0?2:3):level===2?' · Question '+(questionIndex+1)+' sur 2':''}</div><div class="meter"><span style="width:${progress}%"></span></div><div class="art" aria-label="Illustration symbolique">${illustration(active.phrase)}</div><div class="phrase">${formatPhrase(active.phrase)}</div><h3>${escapeHtml(active.prompt)}</h3><div class="choices" id="choices">${shuffled(active.options).map((x,i)=>`<button data-choice="${i}">${escapeHtml(x)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><div class="tip"><strong>Conseil aux parents</strong><p>${escapeHtml(active.extra)} Laissez votre enfant répondre avant de proposer un indice.</p></div></section>`;document.getElementById('back').onclick=()=>choose(track);let opts=shuffled(active.options);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(opts[+b.dataset.choice]));}
function answer(value){attempts++;let ok=value===active.correct;document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);let f=document.getElementById('feedback');if(ok){history.push({level,itemIndex,questionIndex,helped});f.innerHTML=`<div class="good"><strong>Bravo !</strong> ${helped?'Réussite après une aide. Nous reviendrons sur cette notion.':'Réussite sans aide.'}</div><button id="next">Continuer →</button>`;document.getElementById('next').onclick=advance}else{helped=true;tries++;let text=track==='A'?(questionIndex===0?'On cherche ce que fait le personnage : l’action est exprimée par le verbe.':questionIndex===1?'Demande : « Qui est-ce qui '+active.correct.toLowerCase()+' ? » et montre le personnage.':'Repars du verbe et pose la question indiquée.'):'Regarde si le sujet est au singulier ou au pluriel. Cherche la marque écrite correspondante.';f.innerHTML=`<div class="bad"><strong>On cherche ensemble</strong><p>${escapeHtml(text)}</p><p>La réponse attendue était : <strong>${escapeHtml(active.correct)}</strong>.</p><p>Nous allons reprendre la même compétence avec une autre phrase de même structure.</p></div><button id="retry">Essayer avec une autre phrase →</button>`;document.getElementById('retry').onclick=()=>{let count=(track==='A'?A:B)[level].items.length;itemIndex=(itemIndex+1)%count;renderQuestion()}}}
function advance(){let data=(track==='A'?A:B)[level];let max=track==='A'?(level===0?2:3):(level===2?2:1);if(questionIndex+1<max){questionIndex++;renderQuestion();return}questionIndex=0;itemIndex++;if(itemIndex>=data.items.length){finish();return}renderQuestion()}
function finish(){let assisted=history.filter(x=>x.helped).length;$.innerHTML=`<section class="card"><div class="art">Bravo !</div><h2>Étape terminée !</h2><p>Vous avez travaillé : <strong>${escapeHtml((track==='A'?A:B)[level].title)}</strong>.</p><p>Réponses réussies : ${history.length}, dont ${assisted} après aide.</p><div class="tip"><strong>Conseil au parent :</strong> reprenez quelques exemples à l’oral ou sur papier dans deux ou trois jours. Les réussites après aide demandent une consolidation.</div><button id="again">Recommencer l’étape</button><button class="secondary" id="levels">Choisir une autre étape</button></section>`;document.getElementById('again').onclick=()=>start(level);document.getElementById('levels').onclick=()=>choose(track)}showHome();</script></body></html>
