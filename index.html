function pluralMark(s){let parts=s.split(' ');return parts.map((w,i)=>{let base=w.toLowerCase().replace(/[.,!?]/g,'');if(['les','des','mes','tes','ses','ces'].includes(base))return `<span class="red">${esc(w)}</span>`;if(i>0&&/s$/i.test(w))return `${esc(w.slice(0,-1))}<span class="red">${esc(w.slice(-1))}</span>`;return esc(w)}).join(' ')}

function showHome(){state=null;app.innerHTML=`<section class="card"><h1>Deux aventures à partager</h1><p>Des exercices courts, accompagnés par un parent, avec des aides progressives et un bilan de séance.</p><label for="name">Prénom de l’enfant (facultatif)</label><input id="name" maxlength="35" value="${esc(saved.name)}" placeholder="Prénom"><label for="classroom">Classe (repère indicatif)</label><select id="classroom">${['CP','CE1','CE2','CM1','CM2'].map(c=>`<option ${saved.classroom===c?'selected':''}>${c}</option>`).join('')}</select><div class="stack spaced"><button id="syn">Le royaume des phrases — Comprendre la syntaxe</button><button id="agr">La forêt des accords — Observer et écrire</button><button class="secondary" id="hist">Voir les bilans précédents</button></div></section><section class="card"><h2>Notre méthode</h2><p>Dans le parcours des phrases : <strong>le verbe d’abord (avec l’aide « Quelle est l’action ? »), puis le sujet, puis les compléments</strong>. Après une erreur, une aide est proposée et une nouvelle phrase de même structure est présentée.</p><p>Les marques orthographiques sont révélées après la réponse pour favoriser la réflexion.</p></section>`;$('#syn').onclick=()=>levels('syntax');$('#agr').onclick=()=>levels('agreement');$('#hist').onclick=history;}
function persistProfile(){saved.name=$('#name')?.value.trim()||saved.name;saved.classroom=$('#classroom')?.value||saved.classroom;save()}
function levels(mode){persistProfile();app.innerHTML=`<section class="card"><div class="row"><button class="secondary" id="back">← Accueil</button><span class="badge">${mode==='syntax'?'Royaume des phrases':'Forêt des accords'}</span></div><h1>Choisissez une étape</h1><p class="muted">Vous pouvez arrêter la séance à tout moment et obtenir un bilan.</p><div class="stack">${titles[mode].map((t,i)=>`<button data-level="${i}" class="secondary">${i+1}. ${esc(t)} <span class="tiny">(${(mode==='syntax'?syntax:agreement).filter(x=>x.level===i).length} exemples)</span></button>`).join('')}</div></section>`;$('#back').onclick=showHome;document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(mode,+b.dataset.level))}
function start(mode,level){let pool=(mode==='syntax'?syntax:agreement).filter(x=>x.level===level);state={mode,level,pool,index:0,step:0,errors:0,help:false,results:[],tried:[],remedial:0,complete:false};render()}
function steps(t){if(state.mode==='syntax'){let arr=[{q:'Quel est le verbe ?',correct:t.v,wrong:t.s,help:'Demandez : « Quelle est l’action ? » puis « Que fait le personnage ? ». Faites mimer l’action si nécessaire.'},{q:`Qui fait l’action ${t.v==='dort'?'de dormir':t.v==='court'?'de courir':t.v==='jouent'?'de jouer':'dans cette phrase'} ?`,correct:t.s,wrong:t.v,help:'Demandez qui réalise l’action. Montrez le personnage sur l’image.'}];if(t.o)arr.push({q:t.q,correct:t.o,wrong:t.s,help:'Reprenez oralement la phrase et posez la question avec le verbe. Montrez le complément sur l’image.'});if(t.extra)arr.push({q:t.q2,correct:t.extra,wrong:t.o,help:'Faites distinguer ce qui est donné et la personne qui le reçoit.'});return arr}
if(t.level===0)return [{q:'Y a-t-il un seul élément ou plusieurs ?',correct:t.count===1?'un seul':'plusieurs',wrong:t.count===1?'plusieurs':'un seul',help:'Comptez les éléments ensemble, un par un.'}];
if(t.level===1)return [{q:'Quel déterminant convient ?',correct:t.det,wrong:t.count===1?'des':'une',help:'Demandez si l’image montre un seul élément ou plusieurs, puis observez le déterminant.'},{q:'Faut-il ajouter un « s » à la fin du nom ?',correct:t.count===1?'rien':'s',wrong:t.count===1?'s':'rien',help:'Demandez : « Un seul ou plusieurs ? » Faites observer la marque écrite du pluriel.'}];
if(t.level===4)return [{q:'Faut-il ajouter un « s » à l’adjectif ?',correct:t.count===1?'rien':'s',wrong:t.count===1?'s':'rien',help:'Comptez les éléments, puis montrez que l’adjectif s’accorde avec le nom.'},{q:'Faut-il ajouter un « s » au nom ?',correct:t.count===1?'rien':'s',wrong:t.count===1?'s':'rien',help:'Montrez que le nom prend également la marque du pluriel.'}];
return [{q:'Quel est le verbe ?',correct:t.v,wrong:t.s,help:'Demandez : « Quelle est l’action ? » puis « Que fait le personnage ? ». Identifiez ensuite le mot qui exprime cette action.'},{q:'Qui fait l’action ?',correct:t.s,wrong:t.v,help:'Demandez qui réalise cette action.'},{q:'Un seul sujet ou plusieurs ?',correct:t.count===1?'un seul':'plusieurs',wrong:t.count===1?'plusieurs':'un seul',help:'Observez combien de personnages ou d’animaux réalisent l’action.'},{q:'Quelle forme du verbe convient ?',correct:t.v,wrong:t.v.endsWith('ent')?t.v.slice(0,-3)+'e':(t.v.endsWith('e')?t.v+'nt':t.v+'ent'),help:'Comparez le nombre du sujet et la terminaison du verbe. Faites choisir entre les deux formes proposées.'}]
}
function skillName(q,t){if(state.mode==='syntax'){
if(q.correct===t.v)return 'Identifier le verbe';
if(q.correct===t.s)return 'Identifier le sujet';
if(t.kind==='cod'||(t.kind==='double'&&q.correct===t.o))return 'Identifier le COD';
if(t.kind==='coi'||(t.kind==='double'&&q.correct===t.extra))return 'Identifier à qui ou sur qui s’applique l’action';
if(t.kind==='lieu')return 'Identifier le complément de lieu';
if(t.kind==='temps')return 'Identifier le complément de temps';
if(t.kind==='maniere')return 'Identifier le complément de manière';
}return q.q;}
function render(){let t=state.pool[state.index],ss=steps(t),q=ss[state.step];let total=state.pool.length;let text=state.mode==='syntax'?phrase(t):(t.s?t.s+' '+t.v+'.':t.phrase);let choices=[q.correct,q.wrong];if((state.index+state.step)%2)choices.reverse();app.innerHTML=`<section class="card"><div class="row"><button class="secondary" id="steps">← Étapes</button><button class="secondary" id="end">Terminer la séance</button></div><h2>${esc(titles[state.mode][state.level])}</h2><p class="muted">Exemple ${state.index+1} sur ${total} · Question ${state.step+1} sur ${ss.length}${state.remedial?' · Nouvel essai':''}</p><div class="progress"><div style="width:${100*(state.index+state.step/ss.length)/total}%"></div></div><div class="hero">${figure(t.scene)}</div><div class="sentence">${esc(text)}</div><div class="question">${esc(q.q)}</div><div class="grid">${choices.map((c,i)=>`<button class="choice" data-choice="${i}">${esc(c)}</button>`).join('')}</div><div id="feedback" aria-live="polite"></div><details class="parent"><summary>Conseil aux parents · Comment aider ?</summary><p>${esc(q.help)}</p><p>Invitez votre enfant à expliquer son choix. Ne donnez pas immédiatement la réponse.</p></details></section>`;$('#steps').onclick=()=>levels(state.mode);$('#end').onclick=()=>finish(false);document.querySelectorAll('[data-choice]').forEach((b,i)=>b.onclick=()=>answer(choices[i]===q.correct,q,t))}
function answer(ok,q,t){document.querySelectorAll('[data-choice]').forEach(b=>b.disabled=true);let f=$('#feedback');if(ok){let aided=state.help;state.results.push({skill:skillName(q,t),ok:true,aided,level:state.level,example:state.index});f.innerHTML=`<div class="notice"><strong>${aided?'Réussite après aide':'Bravo ! Réussite autonome.'}</strong><p>${state.mode==='syntax'?markup(t,'syntax'):markup(t,'agreement')}</p><p class="tiny">${aided?'Cette compétence sera revue avec une nouvelle phrase.':'Les éléments importants sont mis en évidence après la réponse.'}</p></div><button class="spaced" id="next">Continuer →</button>`;$('#next').onclick=()=>{state.step++;state.help=false;state.remedial=0;if(state.step>=steps(t).length){state.step=0;state.index++}if(state.index>=state.pool.length)finish(true);else render()}}
else{state.results.push({skill:skillName(q,t),ok:false,aided:state.help,level:state.level,example:state.index});state.errors++;state.help=true;f.innerHTML=`<div class="notice warning"><strong>On cherche ensemble.</strong><p>${esc(q.help)}</p><p>Regardez la phrase : ${state.mode==='syntax'?markup(t,'syntax'):markup(t,'agreement')}</p><p>Nous allons proposer un autre exemple de même structure.</p></div><button class="spaced" id="retry">Nouvel exemple →</button>`;$('#retry').onclick=()=>{let alternatives=state.pool.filter((x,i)=>i!==state.index&&!state.tried.includes(i));if(alternatives.length){let idx=state.pool.indexOf(alternatives[0]);state.tried.push(idx);let current=state.pool[state.index];state.pool[state.index]=state.pool[idx];state.pool[idx]=current;state.tried=[];state.remedial++;state.step=0;render()}else{state.step=0;state.remedial++;render()}}}}
function finish(completed){if(!state)return;let s=state;let n=s.results.length,aut=s.results.filter(x=>x.ok&&!x.aided).length,aided=s.results.filter(x=>x.ok&&x.aided).length,fail=s.results.filter(x=>!x.ok).length;let record={date:new Date().toISOString(),mode:s.mode,level:s.level,n,aut,aided,fail,completed,results:s.results};saved.history.unshift(record);saved.history=saved.history.slice(0,50);save();state=null;let groups={};for(let r of record.results){let k=r.skill;groups[k]??={aut:0,aided:0,fail:0};groups[k][r.ok?(r.aided?'aided':'aut'):'fail']++}let weak=Object.entries(groups).filter(([k,v])=>v.fail||v.aided).map(([k])=>k);app.innerHTML=`<section class="card"><span class="badge">Bilan de séance</span><h1>${completed?'Étape terminée !':'Séance terminée'}</h1><p>${esc(titles[record.mode][record.level])} · ${new Date(record.date).toLocaleDateString('fr-FR')}</p><div class="stats"><div class="stat"><b>${aut}</b><span class="tiny">Réussites autonomes</span></div><div class="stat"><b>${aided}</b><span class="tiny">Avec aide</span></div><div class="stat"><b>${fail}</b><span class="tiny">Erreurs</span></div></div><p><strong>${n}</strong> réponse${n>1?'s':''} enregistrée${n>1?'s':''} · ${n?Math.round(100*aut/n):0} % de réussites autonomes parmi les réponses.</p><h2>Compétences travaillées</h2>${Object.entries(groups).length?Object.entries(groups).map(([k,v])=>`<p><strong>${esc(k)}</strong><br><span class="tiny">Autonomes : ${v.aut} · Avec aide : ${v.aided} · Erreurs : ${v.fail}</span></p>`).join(''):'<p>Aucune réponse enregistrée.</p>'}<h2>Pour la prochaine séance</h2><p>${weak.length?'Reprendre en priorité : '+weak.map(esc).join(' ; ')+'. Proposer de nouvelles phrases de même structure.':'Poursuivre la progression, tout en révisant régulièrement les compétences déjà travaillées.'}</p><p class="muted tiny">Ces résultats décrivent uniquement les réponses observées pendant cette séance. Ils ne constituent pas une évaluation diagnostique.</p><div class="stack"><button id="again">Recommencer cette étape</button><button class="secondary" id="back">Choisir une étape</button><button class="secondary" id="home">Accueil</button></div></section>`;$('#again').onclick=()=>start(record.mode,record.level);$('#back').onclick=()=>levels(record.mode);$('#home').onclick=showHome}
function history(){persistProfile();app.innerHTML=`<section class="card"><button class="secondary" id="home">← Accueil</button><h1>Historique des séances</h1>${saved.history.length?saved.history.map(r=>`<div class="parent"><strong>${esc(titles[r.mode]?.[r.level]||'Séance')}</strong><br>${new Date(r.date).toLocaleString('fr-FR')}<br>Autonomes : ${r.aut} · Avec aide : ${r.aided} · Erreurs : ${r.fail}</div>`).join(''):'<p>Aucune séance enregistrée pour le moment.</p>'}<button class="secondary" id="clear">Effacer l’historique</button></section>`;$('#home').onclick=showHome;$('#clear').onclick=()=>{if(confirm('Effacer tous les bilans enregistrés sur cet appareil ?')){saved.history=[];save();history()}}}
showHome();
</script></body></html>
